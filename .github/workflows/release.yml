name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Node 26 is not on the stable download channel yet; switch back to 26 once it is.
          node-version: 24
          cache: pnpm

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v${pkg_version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tgz="$(ls ./*.tgz)"
          gh release create "${TAG}" "${tgz}" --verify-tag --title "${TAG}" --generate-notes
